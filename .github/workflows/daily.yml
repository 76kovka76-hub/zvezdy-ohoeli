name: Daily VK horoscopes

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:
    inputs:
      check_vk_access:
        description: "Проверить токен и доступность сообщества без публикации"
        required: false
        type: boolean
        default: false
      preview_horoscopes:
        description: "Сформировать и показать 12 гороскопов без обращения к ВК"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-vk-horoscopes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
      VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
      VK_CHECK_ONLY: ${{ inputs.check_vk_access }}
      PREVIEW_ONLY: ${{ inputs.preview_horoscopes }}
      TIMEZONE: Europe/Moscow
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run publisher
        run: python main.py
