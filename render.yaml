services:
  - type: cron
    name: zvezdy-ohoeli-daily
    runtime: python
    plan: starter
    schedule: "0 6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: VK_ACCESS_TOKEN
        sync: false
      - key: VK_GROUP_ID
        value: "243138653"
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLISH_ENABLED
        value: "false"
      - key: OPENAI_MODEL
        value: "gpt-4.1-mini"
      - key: VK_API_VERSION
        value: "5.199"
